<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Verification Portal</title>
    <!-- Google Fonts for Ultra Clean Aesthetic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f3ed;
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-border: rgba(212, 175, 55, 0.35);
            --card-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.12), 0 18px 36px -18px rgba(0, 0, 0, 0.08);
            --primary-green: #0d8a43;
            --primary-green-glow: #10b981;
            --gold-accent: #c5a059;
            --gold-light: #fef08a;
            --text-main: #1c1917;
            --text-muted: #57534e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f4ede2 60%, #e8dec8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow accents */
        .bg-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Subtle decorative SVG pattern in background */
        .pattern-overlay {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(197, 160, 89, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        .portal-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid var(--card-border);
            border-radius: 28px;
            padding: 36px 28px 32px 28px;
            box-shadow: var(--card-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portal-card:hover {
            transform: translateY(-2px);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-green);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--primary-green-glow);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 1.8s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        /* Verification Badge Icon Container */
        .badge-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: float 4s ease-in-out infinite;
        }

        .badge-glow-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: transparent;
            border: 1.5px solid rgba(16, 185, 129, 0.4);
            animation: rotate-ring 8s linear infinite;
        }

        @keyframes rotate-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .checkmark-icon {
            position: relative;
            z-index: 2;
            width: 44px;
            height: 44px;
            color: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .heading {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 23px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
            margin-bottom: 10px;
            line-height: 1.25;
        }

        .subtext {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.55;
            font-weight: 500;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        .cta-container {
            position: relative;
            margin-bottom: 20px;
        }

        .cta-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, #0d8a43 0%, #055f2c 100%);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.2px;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 12px 28px -6px rgba(13, 138, 67, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.5);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            animation: pulse-button 2.2s infinite;
        }

        @keyframes pulse-button {
            0% {
                box-shadow: 0 12px 28px -6px rgba(13, 138, 67, 0.5), 0 0 0 0 rgba(16, 185, 129, 0.5);
            }
            70% {
                box-shadow: 0 12px 28px -6px rgba(13, 138, 67, 0.5), 0 0 0 14px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 12px 28px -6px rgba(13, 138, 67, 0.5), 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .cta-button:hover {
            transform: translateY(-2px) scale(1.01);
            background: linear-gradient(135deg, #0fa14f 0%, #066d33 100%);
            box-shadow: 0 16px 32px -4px rgba(13, 138, 67, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        .cta-button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Light sheen streak effect across button */
        .cta-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.35) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: sheen 3.5s infinite;
        }

        @keyframes sheen {
            0% { left: -60%; }
            20% { left: 140%; }
            100% { left: 140%; }
        }

        .cursor-pointer-anim {
            position: absolute;
            bottom: -32px;
            right: 22%;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 15;
            animation: bounce-pointer 1.4s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
        }

        @keyframes bounce-pointer {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-8px, -12px); }
        }

        .timer-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #854d0e;
            background: rgba(254, 240, 138, 0.6);
            border: 1px solid rgba(234, 179, 8, 0.4);
            padding: 6px 14px;
            border-radius: 12px;
            margin-top: 4px;
        }

        .timer-box svg {
            width: 14px;
            height: 14px;
            color: #a16207;
        }

        /* Footer Guarantee / Trust Badges */
        .footer-trust {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px dashed rgba(197, 160, 89, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .trust-item svg {
            width: 13px;
            height: 13px;
            color: var(--gold-accent);
        }

        /* Responsive Tweaks */
        @media (max-width: 480px) {
            .portal-card {
                padding: 30px 20px 26px 20px;
                border-radius: 24px;
            }
            .heading {
                font-size: 20px;
            }
            .subtext {
                font-size: 12.5px;
            }
            .cta-button {
                padding: 16px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient background glow elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="pattern-overlay"></div>

    <main class="portal-card">
        
        <!-- Security Status Indicator -->
        <div class="status-pill">
            <span class="pulse-dot"></span>
            <span>Security Check Passed</span>
        </div>

        <!-- Animated Verification Badge -->
        <div class="badge-wrapper">
            <div class="badge-glow-ring"></div>
            <div class="badge-bg"></div>
            <svg class="checkmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <!-- Headline & Subtitle -->
        <h1 class="heading">Human Verification Portal</h1>
        <p class="subtext">Please click the button below to complete human verification and access your link.</p>

        <!-- Call To Action Button & Interactive Elements -->
        <div class="cta-container">
            <a href="https://pimplehardnesscarnivorous.com/aindgapq5q?key=79732c00d653876f788d8bfbf3e07058" id="smartlinkBtn" target="_blank" rel="noopener noreferrer" class="cta-button">
                <span>▶ CLICK HERE TO VERIFY NOW</span>
            </a>

            <!-- Animated Cursor Pointer -->
            <svg class="cursor-pointer-anim" viewBox="0 0 24 24" fill="none">
                <path d="M3 3L10.07 19.97L12.58 12.58L19.97 10.07L3 3Z" fill="#1c1917" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- Urgency Timer -->
        <div class="timer-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Session expires in <strong id="countdown">01:59</strong></span>
        </div>

        <!-- Footer Trust Badges -->
        <div class="footer-trust">
            <div class="trust-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>256-Bit SSL Secured</span>
            </div>
            <div class="trust-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span>Instant Access</span>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Countdown Urgency Timer Logic
            let timeInSeconds = 119; // 1 min 59 sec
            const countdownEl = document.getElementById('countdown');

            setInterval(() => {
                if (timeInSeconds <= 0) {
                    timeInSeconds = 120; // reset for continuous urgency
                }
                const minutes = Math.floor(timeInSeconds / 60);
                const seconds = timeInSeconds % 60;
                
                countdownEl.textContent = 
                    `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                
                timeInSeconds--;
            }, 1000);
        });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>	
</body>
</html>
